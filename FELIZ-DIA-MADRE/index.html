    <h2>
    FELIZ DIA MAMA <br>
    QUE TENGAS UN HERMOSO DIA IGUAL QUE TU🌹💖👑
</h2>

<div id="mensajes"></div>

    <audio src="Music/gustavo-elis-lyric-video-oficial-letra.mp3" id="bg-music" preload="auto"></audio>
    <script src="Js/script.js"></script>
    <script>

const mensajes = [
  "TE LO DEDICO MAMA",
  "FELIZ DIA MAMA🌹",
  "Los años pasan y yo sigo siendo tu niño",
  "Aveces lo olvido",
  "pero tu aun te preocupas por mi",
  "como si tuviera 5 años",
  "si algo me pasa, ahi estas tu",
  "dejando tus problemas aun lado",
  "solo para abrazarme",
  "Dicen que el amor mas grande de todos es el de una una madre",
  "Y cada dia entiendo mas el porque",
  "En el mundo hay muchas mujeres virtuosas🌹💖",
  "PERO TU MAMA",
  "La superas a TODAS",
  "DIOS me dio la mejor madre del mundo",
  "Y hoy solo quiero decirte",
  "Gracias por tanto AMOR, POR TANTA PACIENCIA",
  "Por no soltarme JAMAS",
  "Mamá, gracias por todo, TE AMO 💖",
  "Eres la mejor mamá del mundo 🌹",
  "Gracias por cuidarme siempre",
  "Te amo muchísimo ❤️",
  "Feliz Día de la Madre 👑"
];

const contenedor = document.getElementById("mensajes");

let index = 0;

function mostrarMensajes(){

    if(index < mensajes.length){

        contenedor.style.opacity = 0;

        setTimeout(() => {

            contenedor.innerHTML = mensajes[index];

            contenedor.style.opacity = 1;

            index++;

            setTimeout(mostrarMensajes, 8000);

        },1000);
    }
}

mostrarMensajes();

</script>
